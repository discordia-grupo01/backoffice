services:
  backoffice:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache git >/dev/null && npm install --no-package-lock --no-audit --no-fund && npm run dev -- -H 0.0.0.0"
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${API_URL_DOCKER:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKOFFICE_PORT:-3001}:3000"
    volumes:
      - .:/app
      - backoffice_node_modules:/app/node_modules

volumes:
  backoffice_node_modules:
